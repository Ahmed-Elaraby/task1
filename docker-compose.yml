networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

services:
  database:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: testdb
      PORT: 3000
    depends_on:
      - database
    networks:
      - backend-net
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    networks:
      - frontend-net
  proxy:
    build: ./proxy
    container_name: proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
      - backend-net

volumes:
  db-data:
